<!DOCTYPE html>
<html lang="uk">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Challenge | ArtSpace</title>

    <script src="js/auth-store.js"></script>
    <script src="js/auth-guard.js"></script>
    <script src="js/api.js"></script>
    <script src="js/i18n.js"></script>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/challenge.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

</head>

<body>

<header class="header profile-header">

    <div
        class="logo"
        onclick="window.location.href='index.html'"
        style="cursor: pointer;">
        ArtSpace
    </div>

    <nav class="profile-nav">

        <a
            href="index.html"
            class="profile-nav-link"
            data-i18n="profile_home">

            Головна

        </a>

        <a
            href="chats.html"
            class="profile-nav-link"
            data-i18n="profile_chats">

            Чати

        </a>

        <a
            href="saved.html"
            class="profile-nav-link"
            data-i18n="profile_saved">

            Збережені

        </a>

        <a
            href="settings.html"
            class="profile-nav-link"
            data-i18n="profile_settings">

            Налаштування

        </a>

    </nav>

    <div class="nav">

        

        <a
            href="profile.html"
            class="profile">

            <img
                src=""
                alt="Профіль"
                class="header-avatar">

        </a>

    </div>

</header>

<div class="challenge-page">

    <div
        class="challenge-hero"
        id="challengeHero">

        Loading...

    </div>

    <div class="challenge-layout">

        <div class="challenge-posts">

            <div
                class="challenge-grid"
                id="challengeGrid">

            </div>

        </div>

        <aside class="challenge-sidebar">

            <div class="leaderboard-card">

                <h3>

                    <i data-lucide="trophy"></i>

                    <span data-i18n="leaderboard">
                        Рейтинг
                    </span>

                </h3>

                <div id="leaderboardList"></div>

            </div>

        </aside>

    </div>

</div>

<div
    class="challenge-modal-overlay hidden"
    id="challengeUploadModal">

    <div class="challenge-upload-modal">

        <div class="challenge-upload-modal-header">

            <h2 data-i18n="challenge_upload_title">
                Завантаження роботи до челенджу
            </h2>

            <button
                class="close-modal-btn"
                onclick="closeChallengeUploadModal()">

                ✕

            </button>

        </div>

        <input
            type="text"
            id="challengePostTitle"
            data-i18n-placeholder="challenge_post_title_placeholder"
            placeholder="Назва роботи"
            class="upload-input"
        >

        <label class="challenge-file-label">

            <span data-i18n="challenge_choose_image">
                Обрати зображення з пристрою
            </span>

            <input
                type="file"
                id="challengePostImageFile"
                accept="image/*"
                class="challenge-file-input"
            >

        </label>

        <div
            class="challenge-image-preview hidden"
            id="challengeImagePreviewBox">

            <img
                src=""
                alt="Preview"
                id="challengeImagePreview">

        </div>

        <button
            class="submit-upload-btn"
            onclick="submitChallengePost()"
            data-i18n="challenge_publish_artwork">

            Опублікувати роботу

        </button>

    </div>

</div>

<div
    class="modal-overlay image-modal-overlay"
    id="challengeImageModal">

    <div class="image-modal-box">

        <button
            class="image-modal-close"
            id="closeChallengeImageModal"
            type="button"
            aria-label="Закрити">

            <i data-lucide="x"></i>

        </button>

        <img
            id="challengeImageModalContent"
            class="image-modal-content"
            src=""
            alt="Challenge post image">

    </div>

</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="js/challenge.js"></script>

</body>
</html>
